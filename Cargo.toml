[package]
name = "lancar-esp32"
version = "0.1.0"
edition = "2021"
resolver = "2"

[dependencies]
anyhow = "1"
log = "0.4"
esp-idf-svc = { version = "0.53", default-features = false, features = ["binstart", "critical-section", "alloc"] }
esp-idf-hal = "0.47"
esp-idf-sys = "0.38"
embedded-svc = "0.29"
critical-section = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
embuild = "0.33.5"
